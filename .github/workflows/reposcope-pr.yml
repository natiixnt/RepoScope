name: reposcope-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RepoScope
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Analyze repository
        run: |
          reposcope analyze . -o scope.json --summary-output scope.md

      - name: Upload RepoScope artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reposcope-map
          path: |
            scope.json
            scope.md
          if-no-files-found: error

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- reposcope-summary -->';
            const preview = fs.readFileSync('scope.md', 'utf8').split('\n').slice(0, 80).join('\n');
            const body = `${marker}\n## RepoScope Summary (preview)\n\n\`\`\`markdown\n${preview}\n\`\`\`\n\nFull files are uploaded as workflow artifacts: \`scope.json\`, \`scope.md\`.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
